; Alembic configuration.
;
; The DSN is deliberately absent — it is read from Settings in env.py so that
; there is exactly one source of truth for connection details. A DSN duplicated
; here is one that will eventually disagree with the application's, and the
; failure mode is migrations applied to the wrong database.

[alembic]
script_location = alembic
prepend_sys_path = src
path_separator = os

; Timestamped, ordered, descriptive filenames:
;   20260806_1430_a1b2c3d4e5f6_add_bookings_table.py
; Pure-hash filenames sort meaninglessly and tell a reviewer nothing.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

timezone = UTC
truncate_slug_length = 40

; Rendered explicitly in env.py so a migration can be reviewed as SQL.
sqlalchemy.url =

[post_write_hooks]
hooks = ruff_format
ruff_format.type = console_scripts
ruff_format.entrypoint = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

; Alembic's own logging is replaced by structlog in env.py; these are the
; fallback for `alembic` invoked outside the app context.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

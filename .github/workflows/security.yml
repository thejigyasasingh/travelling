# Scheduled security scanning.
#
# On a schedule as well as on push, and the schedule is the important half: a
# dependency that was clean when it merged becomes vulnerable the day a CVE is
# published, and nothing about the repository changes to trigger a rebuild.
# Most real exposure arrives this way rather than in a pull request.
#
# Nothing here blocks a deploy. The image scan in `release.yml` does that, on
# the artefact actually being shipped. This job exists to *find* things, and a
# scanner that blocks merges on findings it cannot fix teaches people to skip
# it.

name: security

on:
  schedule:
    # 03:00 UTC daily — after the overnight CVE feeds publish, before anyone
    # starts work, so findings are waiting rather than interrupting.
    - cron: '0 3 * * *'
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

# Code scanning — CodeQL, and the SARIF uploads from Trivy — needs **GitHub
# Advanced Security** on a private repository. Without it the scan runs to
# completion and the upload is rejected, so the job burns four minutes and then
# fails for a reason that has nothing to do with the code.
#
# `CODE_SCANNING` gates those jobs. Set it to `true` in
# *Settings → Secrets and variables → Actions → Variables* once the repository
# is public, or once GHAS is enabled — nothing else needs to change.
#
# The scans still *run* when it is off. Only the upload is skipped, and the
# findings go to the job summary instead, so the pipeline keeps its value on a
# private repo without a licence.
env:
  CODE_SCANNING: ${{ vars.CODE_SCANNING == 'true' }}

jobs:
  # ══════════════════════════════════════════════════════════════════════
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Skipped rather than allowed to fail. CodeQL has no output other than the
    # upload, so running it without somewhere to put the results is four
    # minutes of runner time for nothing.
    if: ${{ vars.CODE_SCANNING == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]

    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # `security-extended` over the default: the extra rules catch the
          # taint-tracking cases that matter for a payments application —
          # unsanitised input reaching a query, a redirect, or a subprocess.
          queries: security-extended

      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}

  # ══════════════════════════════════════════════════════════════════════
  dependencies:
    name: dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # Filesystem mode rather than image mode: this reads the lockfiles, so it
      # sees a vulnerable transitive dependency before an image is ever built.
      - name: Scan lockfiles
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs.sarif
          severity: HIGH,CRITICAL
          # Reported, not blocking — see the header. `exit-code: 0` is
          # deliberate here and deliberately *not* in release.yml.
          exit-code: '0'

      - name: Upload to code scanning
        if: ${{ always() && env.CODE_SCANNING == 'true' }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

      # Where the findings go when there is nowhere to upload them. A scan
      # whose results are discarded is a scan nobody will notice has stopped
      # working.
      - name: Summarise findings
        if: ${{ always() && env.CODE_SCANNING != 'true' }}
        run: |
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          p = pathlib.Path("trivy-fs.sarif")
          if not p.exists():
              print("### Dependency audit\n\n_no report produced_"); raise SystemExit
          runs = json.loads(p.read_text()).get("runs", [])
          results = [r for run in runs for r in run.get("results", [])]
          print(f"### Dependency audit — {len(results)} HIGH/CRITICAL finding(s)\n")
          for r in results[:40]:
              rule = r.get("ruleId", "?")
              msg = r.get("message", {}).get("text", "").splitlines()[0][:160]
              print(f"- `{rule}` {msg}")
          if len(results) > 40:
              print(f"\n_…and {len(results) - 40} more._")
          EOF

      # npm's own advisory database overlaps Trivy's but is not identical, and
      # the JavaScript ecosystem is where the overlap is weakest.
      - name: npm audit
        continue-on-error: true
        run: |
          for app in frontend admin vendor; do
            [[ -d "$app" ]] || continue
            echo "### $app" >> "$GITHUB_STEP_SUMMARY"
            (cd "$app" && npm audit --audit-level=high 2>&1 | tail -20) \
              >> "$GITHUB_STEP_SUMMARY" || true
          done

  # ══════════════════════════════════════════════════════════════════════
  secrets:
    name: secret scanning
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history. A key committed and then removed in the next commit
          # is still in the repository and still needs rotating — scanning only
          # the tip finds nothing.
          fetch-depth: 0

      - name: Scan history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ══════════════════════════════════════════════════════════════════════
  configuration:
    name: infrastructure configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      # Dockerfiles and compose files. Catches the mistakes that do not look
      # like mistakes: a container running as root, a missing USER, a `latest`
      # tag, a secret in an ENV.
      - name: Scan Dockerfiles and compose
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          scan-type: config
          scan-ref: .
          format: sarif
          output: trivy-config.sarif
          severity: HIGH,CRITICAL
          exit-code: '0'

      - name: Upload to code scanning
        if: ${{ always() && env.CODE_SCANNING == 'true' }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config

      - name: Summarise findings
        if: ${{ always() && env.CODE_SCANNING != 'true' }}
        run: |
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          p = pathlib.Path("trivy-config.sarif")
          if not p.exists():
              print("### Infrastructure configuration\n\n_no report produced_"); raise SystemExit
          runs = json.loads(p.read_text()).get("runs", [])
          results = [r for run in runs for r in run.get("results", [])]
          print(f"### Infrastructure configuration — {len(results)} HIGH/CRITICAL finding(s)\n")
          for r in results[:40]:
              loc = (r.get("locations") or [{}])[0]
              path = loc.get("physicalLocation", {}).get("artifactLocation", {}).get("uri", "?")
              msg = r.get("message", {}).get("text", "").splitlines()[0][:140]
              print(f"- `{path}` — {msg}")
          if len(results) > 40:
              print(f"\n_…and {len(results) - 40} more._")
          EOF

      # The checks a scanner will not make, because they are specific to this
      # deployment. Each one is a mistake that has shipped somewhere before.
      - name: Assert the deployment invariants
        run: |
          set -Eeuo pipefail
          fail=0
          note() { echo "::error::$*"; fail=1; }

          cd deploy 2>/dev/null || exit 0

          # A database on the public internet is the single most damaging
          # misconfiguration available, and it is one stray `ports:` away.
          if awk '/^  (postgres|redis):/{s=1} /^  [a-z-]+:$/{if(!/^  (postgres|redis):/) s=0} s&&/^\s+ports:/{print}' \
               docker-compose.prod.yml | grep -q .; then
            note "postgres or redis publishes a port — they must stay on the internal network"
          fi

          # `latest` means a container restarted weeks later comes back as a
          # different build than the one that was tested.
          if grep -nE 'image:.*:latest' docker-compose.prod.yml | grep -v certbot | grep -q .; then
            note "an image is pinned to :latest"
          fi

          # A real secret committed in the example file is a real secret
          # committed.
          if grep -qE '^(POSTGRES_PASSWORD|REDIS_PASSWORD|RAZORPAY_KEY_SECRET|AI_API_KEY)=.+' \
               env/production.env.example; then
            note "env/production.env.example contains a filled-in secret"
          fi

          # Grafana and Prometheus have no authentication worth exposing.
          if grep -nE '^\s+- "[0-9]+:(3000|9090)"' docker-compose.prod.yml | grep -q .; then
            note "Grafana or Prometheus is published on all interfaces — bind to 127.0.0.1"
          fi

          exit $fail

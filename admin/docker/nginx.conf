# Serving the admin panel.
#
# Two caching rules and one routing rule, and getting any of them wrong is
# either a stale app nobody can fix remotely or a cache that does nothing.
#
# Security headers are deliberately *absent* here. The edge proxy sets them
# once for every host — see `deploy/nginx/snippets/security-headers.conf`.
# Setting them in both places is how you end up with two CSPs, one of which is
# quietly overriding the other.

server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # The edge terminates TLS and does the compressing. Doing it again here is
    # CPU spent twice on the same bytes.
    gzip off;

    # Container liveness. Answered without touching the filesystem so a full
    # disk still reports honestly rather than hanging.
    # Belt and braces with the meta tag in index.html. An internal tool that
    # turns up in a search index is an internal tool someone will try.
    add_header X-Robots-Tag "noindex, nofollow" always;

    location = /robots.txt {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # Hashed assets: the filename changes whenever the content does, so these
    # can be cached effectively forever. `immutable` stops browsers
    # revalidating on reload, which is most of what makes a repeat visit fast.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # **index.html must never be cached.** It is the file that names the
    # current asset hashes, so a cached copy pins a browser to a deployment
    # that no longer exists — and there is no way to invalidate it from the
    # server side. This one directive is the difference between a deploy that
    # reaches users and one that reaches only people who hard-refresh.
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, must-revalidate";
    }

    # Client-side routing: every unknown path is a route, not a 404. The
    # `=404` on the asset block above is what keeps a missing JavaScript file
    # from being served the HTML shell — which produces the famously confusing
    # "Unexpected token '<'" in the console.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Dotfiles are never part of a build output. If one appears, it is either
    # a mistake or an attack.
    location ~ /\. {
        deny all;
        access_log off;
    }
}

# Four hosts, one API.
#
#   roamingwandering.com        the customer site
#   admin.roamingwandering.com  staff
#   host.roamingwandering.com   vendors
#
# The API is mounted under `/api/` on each of them rather than living on its
# own hostname. That is a deliberate choice and the refresh cookie is the
# reason: it is HttpOnly and scoped to `/api/v1/auth`, and a cross-origin API
# host would need SameSite=None to send it — which is precisely the setting
# CSRF protection exists to avoid. Same origin means the cookie is SameSite=Lax
# and the whole class of attack is closed by the browser.

upstream api {
    # `least_conn`, not round robin: request durations here vary by two orders
    # of magnitude — a cached search versus a generated itinerary — and round
    # robin queues a fast request behind a slow one on an already-busy worker.
    least_conn;
    server api:8000 max_fails=3 fail_timeout=15s;
    # Reuse connections. Without this every proxied request pays a TCP
    # handshake to a container one hop away.
    keepalive 64;
    keepalive_timeout 60s;
}

upstream web    { server web:8080    max_fails=3 fail_timeout=15s; keepalive 16; }
upstream admin  { server admin:8080  max_fails=3 fail_timeout=15s; keepalive 8;  }
upstream vendor { server vendor:8080 max_fails=3 fail_timeout=15s; keepalive 8;  }

# ══════════════════════════════════════════════════════════════════════════
# Port 80 — ACME, and a redirect
# ══════════════════════════════════════════════════════════════════════════
server {
    listen 80;
    listen [::]:80;
    server_name roamingwandering.com www.roamingwandering.com
                admin.roamingwandering.com host.roamingwandering.com;

    # The one path that must stay on HTTP. Certbot writes a token here and the
    # CA reads it back over port 80; redirecting it to HTTPS makes renewal fail
    # in a way that only shows up 90 days later.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ══════════════════════════════════════════════════════════════════════════
# The customer site
# ══════════════════════════════════════════════════════════════════════════
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name roamingwandering.com www.roamingwandering.com;

    ssl_certificate     /etc/letsencrypt/live/roamingwandering.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/roamingwandering.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/roamingwandering.com/chain.pem;
    include /etc/nginx/snippets/tls.conf;
    include /etc/nginx/snippets/security-headers.conf;

    # CSP for the public site.
    #
    # `frame-src` and the Razorpay origins are not optional — checkout opens in
    # an iframe from `api.razorpay.com`, and a CSP that omits it produces a
    # blank payment modal with an error only visible in the console.
    #
    # `unsafe-inline` on style-src is honest rather than aspirational: Tailwind
    # emits inline styles for arbitrary values, and claiming otherwise would
    # mean a policy that gets switched off the first time a page breaks.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://checkout.razorpay.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://cdn.roamingwandering.com https://*.tile.openstreetmap.org; font-src 'self' data:; connect-src 'self' https://api.razorpay.com https://lumberjack.razorpay.com; frame-src https://api.razorpay.com https://checkout.razorpay.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;

    limit_conn perip 32;

    # ── the API ───────────────────────────────────────────────────────────

    # Sign-in, registration, OTP, password reset. Its own zone because
    # credential stuffing looks nothing like normal traffic and must not be
    # able to consume the general allowance.
    location ~ ^/api/v1/auth/(login|register|otp|password|refresh) {
        limit_req zone=auth burst=5 nodelay;
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://api;
    }

    # Razorpay's webhook. Excluded from rate limiting on purpose: dropping one
    # loses a payment confirmation, and the endpoint authenticates every
    # request by HMAC over the raw body — an unsigned flood is rejected before
    # it touches the database.
    location = /api/v1/payments/webhook {
        include /etc/nginx/snippets/proxy.conf;
        # The signature is computed over the exact bytes. Any rewriting here
        # invalidates it.
        proxy_pass http://api;
    }

    # Generation is slow by nature. A longer read timeout here rather than
    # raising it globally, which would let every wedged request hang for a
    # minute.
    location ~ ^/api/v1/ai/(itinerary|chat) {
        limit_req zone=api burst=5 nodelay;
        include /etc/nginx/snippets/proxy.conf;
        proxy_read_timeout 90s;
        proxy_pass http://api;
    }

    location /api/ {
        limit_req zone=api burst=30 nodelay;
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://api;
    }

    # ── operational endpoints, not for the public ─────────────────────────

    # Prometheus scrapes this over the internal network. Exposing it publicly
    # hands out request rates, error counts and endpoint names.
    location = /metrics { deny all; access_log off; }

    # The docs describe every endpoint and every schema. Useful in staging,
    # a map for anyone probing production.
    location ~ ^/(docs|redoc|openapi\.json)$ { deny all; }

    # ── the app ───────────────────────────────────────────────────────────
    location / {
        limit_req zone=general burst=60 nodelay;
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://web;
    }
}

# ══════════════════════════════════════════════════════════════════════════
# Admin and host portals
#
# Same shape, stricter policy: no third-party origins at all, and an
# `X-Robots-Tag` so neither turns up in a search index.
# ══════════════════════════════════════════════════════════════════════════
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name admin.roamingwandering.com;

    ssl_certificate     /etc/letsencrypt/live/roamingwandering.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/roamingwandering.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/roamingwandering.com/chain.pem;
    include /etc/nginx/snippets/tls.conf;
    include /etc/nginx/snippets/security-headers.conf;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://cdn.roamingwandering.com; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    limit_conn perip 32;

    # Optional but recommended: an allowlist in front of the whole panel.
    # Commented rather than removed because it is the first thing to reach for
    # after an incident, and because a wrong CIDR here locks out the people who
    # would fix it.
    #
    #   include /etc/nginx/snippets/office-allowlist.conf;
    #   deny all;

    location ~ ^/api/v1/auth/(login|register|otp|password|refresh) {
        limit_req zone=auth burst=5 nodelay;
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://api;
    }

    location /api/ {
        limit_req zone=api burst=30 nodelay;
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://api;
    }

    location = /metrics { deny all; access_log off; }

    location / {
        limit_req zone=general burst=60 nodelay;
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://admin;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name host.roamingwandering.com;

    ssl_certificate     /etc/letsencrypt/live/roamingwandering.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/roamingwandering.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/roamingwandering.com/chain.pem;
    include /etc/nginx/snippets/tls.conf;
    include /etc/nginx/snippets/security-headers.conf;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://cdn.roamingwandering.com; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    limit_conn perip 32;

    location ~ ^/api/v1/auth/(login|register|otp|password|refresh) {
        limit_req zone=auth burst=5 nodelay;
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://api;
    }

    location /api/ {
        limit_req zone=api burst=30 nodelay;
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://api;
    }

    location = /metrics { deny all; access_log off; }

    location / {
        limit_req zone=general burst=60 nodelay;
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://vendor;
    }
}

# ══════════════════════════════════════════════════════════════════════════
# Default server — anything that did not match a name above
#
# Without this, a request with an unknown or absent Host header falls through
# to the *first* server block, which would serve the customer site to anyone
# scanning the IP directly and put it in certificate transparency logs against
# the wrong name. 444 closes the connection without a response.
# ══════════════════════════════════════════════════════════════════════════
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    listen 80 default_server;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/roamingwandering.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/roamingwandering.com/privkey.pem;
    ssl_reject_handshake on;

    return 444;
}

# TLS, as of 2026.
#
# TLS 1.2 and 1.3 only. 1.0 and 1.1 are withdrawn and fail PCI DSS, which
# matters directly here: this platform takes card payments through Razorpay
# and inherits the scope.
ssl_protocols TLSv1.2 TLSv1.3;

# 1.3 suites are chosen by OpenSSL and are all sound; this list is the 1.2
# fallback. AEAD only — no CBC, which is where the padding-oracle family lives.
# ECDHE only, so a stolen private key cannot decrypt captured traffic after the
# fact.
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

# Let the client pick. Modern clients order by what their hardware does fastest
# — a phone without AES instructions prefers ChaCha20 and is right to.
ssl_prefer_server_ciphers off;

ssl_ecdh_curve X25519:prime256v1:secp384r1;

# OCSP stapling: the server proves its own certificate is unrevoked, so the
# browser does not make a third-party request that leaks which site is being
# visited — and does not hang when the CA's responder is slow.
ssl_stapling on;
ssl_stapling_verify on;
resolver 127.0.0.11 valid=300s ipv6=off;   # Docker's embedded DNS
resolver_timeout 5s;

# Everything an upstream needs to reconstruct the original request.
#
# `$host` rather than `$proxy_host`: the application builds absolute URLs —
# password reset links, invoice PDFs — and getting this wrong emails people a
# link to an internal container name.
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
# Without this the application believes it is on HTTP and issues session
# cookies without `Secure`.
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Forwarded-Port  $server_port;
proxy_set_header X-Request-Id      $request_id_final;

# Long enough for a slow report, short enough that a wedged worker is not held
# open for minutes. The AI itinerary endpoint is the slowest thing here and has
# its own longer timeout at its location block.
proxy_connect_timeout 5s;
proxy_send_timeout    30s;
proxy_read_timeout    30s;

# Buffer the response so a slow client reading at 3G speeds does not pin an
# application worker for the duration.
proxy_buffering on;
proxy_buffer_size 8k;
proxy_buffers 16 8k;
proxy_busy_buffers_size 16k;

# Retry the *next* upstream on a connection-level failure only. Deliberately
# not on `error` after the request was sent, and never on a timeout: a POST
# that created a booking and then timed out must not be replayed.
proxy_next_upstream error invalid_header http_502 http_503;
proxy_next_upstream_tries 2;

# Security headers, set once at the edge for every host.
#
# `always` on every one of them. Without it nginx omits the header on error
# responses — and a 500 page is exactly where a reflected payload would land.

# HSTS. Two years, subdomains included, preload-eligible.
#
# Worth understanding before enabling: preload is effectively irreversible.
# Once the list ships in a browser release, that domain and every subdomain are
# HTTPS-only for the lifetime of that browser install, whatever this server
# later says. Do not add `preload` until every subdomain — including anything
# internal — can serve TLS.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

# MIME sniffing turned an uploaded "image" into executable script for years.
add_header X-Content-Type-Options "nosniff" always;

# Clickjacking. CSP frame-ancestors below is the modern control and is what
# browsers honour; this is for the ones that do not.
add_header X-Frame-Options "DENY" always;

# Referrers: full URL to ourselves, origin only to third parties. A booking
# confirmation URL sent to an analytics vendor is a leak.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Features this site never uses. Denying them means a compromised script
# cannot turn on a microphone.
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(self), gyroscope=(), magnetometer=(), microphone=(), payment=(self), usb=()" always;

# Cross-origin isolation. `same-site` on the opener stops a popup keeping a
# handle on the window that spawned it.
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-site" always;

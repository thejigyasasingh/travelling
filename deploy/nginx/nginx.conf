# The edge.
#
# One process in front of everything: TLS termination, the security headers,
# the rate limit zones, and the routing to four upstreams. Everything behind it
# speaks plain HTTP on a private network and trusts the `X-Forwarded-*` headers
# this file sets — which is only safe because nothing else can reach those
# ports.

user  nginx;
# `auto` is one worker per core. Anything else is a guess about hardware you do
# not control.
worker_processes  auto;
worker_rlimit_nofile 65535;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  8192;
    # Accept as many connections as are waiting rather than one per loop. On a
    # burst — a marketing email landing — the difference is visible.
    multi_accept        on;
    use                 epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── logging ───────────────────────────────────────────────────────────
    #
    # JSON, because these lines are read by Promtail and then by a query
    # language, not by a person tailing a file. A combined-format line has to
    # be regex-parsed at ingest, which is both slower and one grammar change
    # away from silently dropping fields.
    #
    # `request_id` is generated here when the client did not send one and is
    # forwarded upstream, so a browser complaint, an nginx line and an
    # application log all carry the same id.
    log_format json escape=json
        '{'
          '"time":"$time_iso8601",'
          '"remote_addr":"$remote_addr",'
          '"request_id":"$request_id",'
          '"method":"$request_method",'
          '"host":"$host",'
          '"path":"$uri",'
          '"query":"$args",'
          '"status":$status,'
          '"bytes_sent":$body_bytes_sent,'
          '"referer":"$http_referer",'
          '"user_agent":"$http_user_agent",'
          '"request_time":$request_time,'
          '"upstream_time":"$upstream_response_time",'
          '"upstream_status":"$upstream_status",'
          '"upstream_addr":"$upstream_addr"'
        '}';

    access_log /var/log/nginx/access.log json buffer=32k flush=5s;

    # ── transfer ──────────────────────────────────────────────────────────
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 4096;
    server_tokens   off;          # the version number helps nobody but a scanner

    # A booking payload is small; an image upload does not come through here,
    # it is presigned straight to object storage. 2 MB is generous for JSON and
    # small enough that a body-size attack is not free.
    client_max_body_size 2m;
    client_body_timeout  15s;
    client_header_timeout 15s;
    # Slowloris: a client that opens a connection and dribbles bytes holds a
    # worker slot. These two timeouts are the cheapest defence there is.
    send_timeout 20s;
    reset_timedout_connection on;

    # ── compression ───────────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   5;      # 6+ costs measurably more CPU for ~1% more
    gzip_min_length   1024;   # below this the header overhead exceeds the saving
    gzip_proxied      any;
    gzip_types
        application/javascript application/json application/xml
        text/css text/javascript text/plain text/xml
        image/svg+xml application/manifest+json;

    # ── rate limiting ─────────────────────────────────────────────────────
    #
    # A second layer, not the only one. The application rate-limits per user
    # with Redis and knows who is calling; this knows only an IP, and exists to
    # stop traffic that never should have reached Python at all.
    #
    # $binary_remote_addr rather than $remote_addr: 4 bytes per IPv4 entry
    # instead of up to 15, which is the difference between 10m holding ~160k
    # clients and ~40k.
    limit_req_zone $binary_remote_addr zone=general:10m  rate=30r/s;
    limit_req_zone $binary_remote_addr zone=api:10m      rate=15r/s;
    # Credential stuffing is slow and patient, so this one is deliberately
    # brutal. A human signing in never exceeds it.
    limit_req_zone $binary_remote_addr zone=auth:10m     rate=10r/m;
    limit_conn_zone $binary_remote_addr zone=perip:10m;

    # 429, not 503: the client did something, and a well-behaved one backs off
    # on 429 while treating 503 as "the server is broken, retry hard".
    limit_req_status  429;
    limit_conn_status 429;
    limit_req_log_level warn;

    # ── proxying ──────────────────────────────────────────────────────────
    proxy_http_version 1.1;
    proxy_set_header Connection "";        # enables upstream keepalive

    # Generated when absent, forwarded always. This is what makes a support
    # ticket traceable from a screenshot to a stack trace.
    map $http_x_request_id $request_id_final {
        default   $http_x_request_id;
        ""        $request_id;
    }

    # ── TLS, shared across every server block ─────────────────────────────
    #
    # A single session cache. Defined at http level because a per-server cache
    # means a client resuming against a different vhost does a full handshake.
    ssl_session_cache   shared:SSL:20m;
    ssl_session_timeout 1d;
    # Off: tickets without rotation break forward secrecy, and rotating them
    # across a fleet is machinery worth more than the handshake it saves.
    ssl_session_tickets off;

    include /etc/nginx/conf.d/*.conf;
}

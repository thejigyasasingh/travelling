# What gets scraped, and how often.
#
# 15s everywhere. Fast enough that a five-minute alert window has twenty
# samples to judge on, slow enough that a month of retention fits in single-
# digit gigabytes. Changing it changes the meaning of every `rate()` in the
# rules, so it is one number in one place.

global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    # Stamped on every series leaving here. Without it, two environments
    # sending to the same long-term store are indistinguishable.
    environment: production
    cluster: rw-prod

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # Prometheus watching itself. The first thing to check when alerts stop
  # arriving is whether this target is up.
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  # The application. `/metrics` is blocked at the edge and reachable only on
  # the `observe` network — request rates and endpoint names are not public
  # information.
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: [api:8000]
        labels: {service: api}

  - job_name: worker
    metrics_path: /metrics
    static_configs:
      - targets: [worker:8000]
        labels: {service: worker}

  - job_name: postgres
    static_configs:
      - targets: [postgres-exporter:9187]

  - job_name: redis
    static_configs:
      - targets: [redis-exporter:9121]

  # The host. Disk-full is what takes Postgres down, and it is the failure an
  # application-level metric never sees coming.
  - job_name: node
    static_configs:
      - targets: [node-exporter:9100]

  - job_name: cadvisor
    static_configs:
      - targets: [cadvisor:8080]
    metric_relabel_configs:
      # cAdvisor emits thousands of series per container. Keeping only what the
      # dashboards and rules actually read is the difference between a 400 MB
      # and a 4 GB TSDB.
      - source_labels: [__name__]
        regex: 'container_(cpu_usage_seconds_total|memory_working_set_bytes|memory_usage_bytes|network_(receive|transmit)_bytes_total|fs_usage_bytes|last_seen|spec_memory_limit_bytes)'
        action: keep
